<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>安靜新幹線 - 慢活鐵道小世界</title>
<style>
:root {
  --card: rgba(255, 252, 245, 0.94);
  --fg: #1e293b;
  color-scheme: light dark;
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-l: env(safe-area-inset-left, 0px);
  --safe-r: env(safe-area-inset-right, 0px);
  --ic: 50px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --card: rgba(24, 32, 46, 0.95);
    --fg: #f1f5f9;
  }
}
*, *::before, *::after {
  box-sizing: border-box;
}
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  height: 100dvh;
  overflow: hidden;
  background: #8ab4d8;
  color: var(--fg);
  font-family: "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
  user-select: none;
  -webkit-user-select: none;
  touch-action: none;
  -webkit-touch-callout: none;
  overscroll-behavior: none;
}
canvas#c {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  touch-action: none;
  z-index: 1;
}
.card {
  background: var(--card);
  border-radius: 16px;
  box-shadow: 0 6px 20px rgba(0, 0, 0, 0.18);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
}
button, select {
  font: inherit;
  border: 1px solid rgba(136, 136, 136, 0.35);
  border-radius: 12px;
  background: var(--card);
  color: var(--fg);
  padding: 6px 12px;
  cursor: pointer;
  transition: transform 0.15s, background-color 0.2s;
  -webkit-tap-highlight-color: transparent;
}
button:active {
  transform: scale(0.96);
}
.ic {
  width: var(--ic);
  height: var(--ic);
  font-size: calc(var(--ic) * 0.45);
  padding: 0;
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

/* 頂部響應式 HUD 容器（確保橫豎屏絕不重疊、不裁切） */
#hudTop {
  position: fixed;
  top: calc(8px + var(--safe-t));
  left: calc(8px + var(--safe-l));
  right: calc(8px + var(--safe-r));
  z-index: 12;
  display: flex;
  flex-wrap: wrap;
  align-items: flex-start;
  justify-content: space-between;
  gap: 8px;
  pointer-events: none;
}
#hudTop > * {
  pointer-events: auto;
}
#hudLeft {
  display: flex;
  flex-direction: column;
  gap: 6px;
  max-width: calc(100% - 220px);
}

/* 左上燈號與倒數條 */
#lamp {
  position: relative;
  height: 58px;
  min-width: 110px;
  padding: 0 12px;
  font-size: 26px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  border: 3px solid #4ade80;
  transition: border-color 0.3s;
  overflow: hidden;
}
#lampCountdown {
  font-size: 14px;
  font-weight: 800;
  color: var(--fg);
  white-space: nowrap;
}
#lampBar {
  position: absolute;
  left: 0;
  bottom: 0;
  height: 6px;
  background: #22c55e;
  width: 0%;
  transition: width 0.15s linear;
}

/* 常駐分貝條與數值 */
#volWrap {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 6px 10px;
  min-width: 165px;
}
#volBar {
  position: relative;
  width: clamp(95px, 22vw, 150px);
  height: 12px;
  background: #e2e8f0;
  border-radius: 99px;
  overflow: hidden;
  border: 1px solid rgba(148, 163, 184, 0.5);
  flex-shrink: 0;
}
#volFill {
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  width: 0%;
  background: linear-gradient(90deg, #22c55e 0%, #eab308 65%, #ef4444 100%);
  border-radius: 99px;
  transition: width 0.06s linear;
}
#volGoal {
  position: absolute;
  top: 0;
  bottom: 0;
  width: 2.5px;
  background: #0f172a;
  transform: translateX(-50%);
  pointer-events: none;
  z-index: 2;
}
#volNum {
  font-size: 13px;
  font-weight: 800;
  min-width: 4.2em;
  text-align: right;
  color: var(--fg);
  font-variant-numeric: tabular-nums;
}

/* 中央進度／圖鑑進度與校正狀態 */
#dots {
  padding: 6px 12px;
  font-size: clamp(12px, 2.2vw, 14px);
  font-weight: 700;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px 10px;
  flex-wrap: wrap;
  text-align: center;
  line-height: 1.35;
  max-width: 100%;
  align-self: center;
}
#dwellHint {
  font-size: 12px;
  color: #15803d;
  background: #dcfce7;
  padding: 2px 8px;
  border-radius: 99px;
  font-weight: 700;
  white-space: nowrap;
}
#wakeBanner {
  font-size: 11px;
  color: #b45309;
  background: #fef3c7;
  padding: 2px 8px;
  border-radius: 99px;
  font-weight: 700;
}

/* 右上按鈕列 */
#top {
  display: flex;
  gap: 6px;
  align-items: center;
  flex-shrink: 0;
}
#badge {
  position: absolute;
  right: -5px;
  top: -5px;
  font-size: 16px;
}

/* 設定面板：可捲動，適配橫直向 */
#set {
  position: fixed;
  right: calc(8px + var(--safe-r));
  top: calc(14px + var(--safe-t) + var(--ic));
  width: min(340px, calc(100vw - 16px - var(--safe-l) - var(--safe-r)));
  max-height: calc(100dvh - var(--safe-t) - var(--safe-b) - var(--ic) - 24px);
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 12px 14px;
  font-size: 13.5px;
  z-index: 25;
  touch-action: pan-y;
}
#set label, #set .row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  margin: 8px 0;
  flex-wrap: wrap;
}
#set input[type=range] {
  width: 100%;
  touch-action: pan-y;
}

/* Modal 彈窗：直式／橫式皆自動縮放不裁切 */
.modal {
  position: fixed;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  width: min(760px, calc(100vw - 16px - var(--safe-l) - var(--safe-r)));
  max-height: calc(100dvh - 16px - var(--safe-t) - var(--safe-b));
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 18px;
  text-align: center;
  z-index: 30;
  margin: 0;
  touch-action: pan-y;
}
.go {
  font-size: clamp(20px, 4.5vw, 28px);
  padding: 12px 36px;
  background: #2e7d32;
  color: #fff;
  border: 0;
  border-radius: 99px;
  box-shadow: 0 4px 14px rgba(46, 125, 50, 0.35);
  font-weight: 800;
}

/* 右下收錄卡 */
#cornerCard {
  position: fixed;
  right: calc(10px + var(--safe-r));
  bottom: calc(10px + var(--safe-b));
  width: min(290px, calc(100vw - 20px - var(--safe-l) - var(--safe-r)));
  padding: 10px 14px;
  text-align: left;
  z-index: 15;
  transform: translateY(150%);
  opacity: 0;
  transition: transform 0.55s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.45s;
  border-left: 6px solid #2563eb;
  pointer-events: none;
}
#cornerCard.show {
  transform: translateY(0);
  opacity: 1;
}
#cornerCard .cc-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 12px;
  font-weight: 700;
  color: #b45309;
}
#cornerCard .cc-name {
  font-size: clamp(15px, 4vw, 19px);
  font-weight: 900;
  margin: 4px 0 2px;
  display: flex;
  align-items: center;
  gap: 6px;
}
#cornerCard .cc-stars {
  color: #f59e0b;
  font-size: 13px;
  letter-spacing: 2px;
  margin-bottom: 4px;
}
#cornerCard .cc-route {
  font-size: 12px;
  font-weight: 700;
  background: rgba(136, 136, 136, 0.15);
  padding: 3px 9px;
  border-radius: 8px;
  display: inline-block;
  max-width: 100%;
  word-break: break-word;
}

/* 圖鑑網格 */
#grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(min(200px, 100%), 1fr));
  gap: 10px;
  margin-top: 10px;
}
.dex-item {
  background: rgba(136, 136, 136, 0.13);
  border-radius: 14px;
  padding: 10px;
  font-size: 13px;
  text-align: left;
  cursor: pointer;
  transition: 0.2s;
  border: 2px solid transparent;
}
.dex-item:hover {
  border-color: #3b82f6;
}
.dex-item canvas {
  width: 100%;
  height: auto;
  border-radius: 10px;
  background: linear-gradient(180deg, #dbeafe, #f1f5f9);
}
.dex-item .di-title {
  font-weight: 800;
  font-size: 14px;
  margin-top: 6px;
  display: flex;
  justify-content: space-between;
  gap: 6px;
  flex-wrap: wrap;
}
.dex-item .di-route {
  font-size: 12px;
  opacity: 0.8;
  margin-top: 2px;
}
#detailBox {
  background: rgba(136, 136, 136, 0.1);
  border-radius: 14px;
  padding: 12px;
  margin-bottom: 12px;
  text-align: left;
  border: 1px solid rgba(136, 136, 136, 0.25);
}
#detailBox .db-head {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  align-items: center;
}
#detailBox .db-photo {
  width: min(210px, 100%);
  height: 125px;
  border-radius: 10px;
  object-fit: cover;
  background: rgba(0, 0, 0, 0.12);
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  position: relative;
  flex-shrink: 0;
}
#detailBox .db-photo img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* 開發者 Debug 面板 */
#dbg {
  position: fixed;
  left: calc(8px + var(--safe-l));
  bottom: calc(8px + var(--safe-b));
  z-index: 50;
  width: min(310px, calc(100vw - 16px - var(--safe-l) - var(--safe-r)));
  max-height: 48dvh;
  overflow-y: auto;
  font: 11.5px/1.42 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  background: rgba(15, 23, 42, 0.92);
  color: #e2e8f0;
  border: 1px solid rgba(148, 163, 184, 0.35);
  border-radius: 12px;
  padding: 10px 12px;
  display: none;
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  white-space: pre-wrap;
  word-break: break-word;
  touch-action: pan-y;
}
#dbg.on {
  display: block;
}
#dbg .ok { color: #4ade80; font-weight: 700; }
#dbg .bad { color: #f87171; font-weight: 700; }
#dbg .warn { color: #fbbf24; font-weight: 700; }
#dbg .err-banner {
  background: #dc2626;
  color: #fff;
  padding: 3px 6px;
  border-radius: 6px;
  font-weight: 800;
  display: block;
  margin-bottom: 6px;
}

[hidden] {
  display: none !important;
}

/* 直向手機與窄螢幕適配 */
@media (max-width: 640px), (orientation: portrait) {
  :root { --ic: 44px; }
  #hudLeft {
    max-width: calc(100% - 196px);
  }
  #lamp {
    height: 48px;
    font-size: 22px;
    padding: 0 10px;
  }
  #dots {
    order: 3;
    width: 100%;
    justify-content: flex-start;
  }
  #set {
    left: calc(8px + var(--safe-l));
    right: calc(8px + var(--safe-r));
    width: auto;
  }
}

/* 橫向矮螢幕適配 */
@media (orientation: landscape) and (max-height: 500px) {
  :root { --ic: 40px; }
  #hudTop {
    gap: 6px;
  }
  #hudLeft {
    flex-direction: row;
    align-items: center;
    max-width: none;
  }
  #lamp {
    height: 40px;
    font-size: 20px;
    padding: 0 8px;
  }
  #volWrap {
    padding: 4px 8px;
    height: 40px;
  }
  #dots {
    padding: 4px 10px;
    font-size: 11.5px;
  }
  .modal {
    padding: 12px;
  }
}
</style>
</head>
<body>
<canvas id="c"></canvas>

<!-- 頂部整合導覽列（自動適配直向與橫向） -->
<div id="hudTop" hidden>
  <div id="hudLeft">
    <div id="lamp" class="card">
      <span id="lampTxt">🟢🙂</span>
      <span id="lampCountdown"></span>
      <div id="lampBar"></div>
    </div>
    <div id="volWrap" class="card">
      <div id="volBar">
        <div id="volFill"></div>
        <div id="volGoal"></div>
      </div>
      <span id="volNum">0 dB</span>
    </div>
  </div>

  <div id="dots" class="card">
    <span id="dotsTxt"></span>
    <span id="dwellHint" hidden>🤫 安靜觀察中・列車停留延長</span>
    <span id="wakeBanner" hidden>💡 請將自動鎖定設定為永不</span>
  </div>

  <div id="top">
    <button id="callBtn" class="card ic" title="召喚列車 / 提前發車">🔔</button>
    <button id="alb" class="card ic" title="鐵道探索收藏館">🚆<span id="badge" hidden>🎁</span></button>
    <button id="dbgBtn" class="card ic" title="切換開發者 Debug 面板">🐞</button>
    <button id="gear" class="card ic" title="設定">⚙</button>
  </div>
</div>

<!-- 開發者 Debug 面板 -->
<div id="dbg"></div>

<!-- 右下：新車進站自動收錄卡片 -->
<div id="cornerCard" class="card">
  <div class="cc-top"><span id="ccStatus">✨ 新車進站收錄</span><span id="ccType">新幹線</span></div>
  <div class="cc-name">🚄 <span id="ccName">E7 北陸新幹線</span></div>
  <div class="cc-stars" id="ccStars">⭐⭐⭐</div>
  <div class="cc-route" id="ccRoute">東京 → 金澤・敦賀</div>
</div>

<!-- 設定選單 -->
<div id="set" class="card" hidden>
  <div class="row">靈敏度微調（環境音 + 裕度）<span>
    <button type="button" data-g="10">嚴格</button>
    <button type="button" data-g="18">適中</button>
    <button type="button" data-g="28">寬鬆</button>
  </span></div>
  <input id="goal" type="range" min="12" max="85" value="35" step="1">
  <div class="row" style="font-size:12px;opacity:.9">
    <span>環境音 / 安靜門檻</span>
    <span id="goalLive">環境 20 / 門檻 35</span>
  </div>
  <div class="row" style="font-size:12px;opacity:.9">
    <span>目前即時音量</span>
    <span id="lvlReadout">0 / 門檻 35</span>
  </div>
  <div class="row">
    <button type="button" id="cal">🎚 重新5秒環境音校正</button>
    <button type="button" id="noise">🔊 按住測試吵鬧</button>
  </div>
  <div class="row" style="margin-top:8px">
    <button type="button" id="saveCfgBtn" style="width:100%;background:#2563eb;color:#fff;border:0;padding:9px 14px;font-weight:800">💾 儲存設定</button>
  </div>
  <div id="saveHint" style="font-size:12px;color:#16a34a;min-height:1.2em"></div>
  <label>候車安靜倒數
    <select id="rate">
      <option value="8">短 (8秒)</option>
      <option value="15" selected>適中 (15秒)</option>
      <option value="25">長 (25秒)</option>
    </select>
  </label>
  <label>月台停靠時間
    <select id="dwellT">
      <option value="20">20 秒 (安靜可延至35秒)</option>
      <option value="30" selected>30 秒 (安靜可延至50秒)</option>
      <option value="45">45 秒 (安靜可延至65秒)</option>
    </select>
  </label>
  <label>風景切換
    <select id="sceneT">
      <option value="0">立刻切換下一站風景</option>
      <option value="180" selected>每 3 分鐘</option>
      <option value="300">每 5 分鐘</option>
    </select>
  </label>
  <label>溫和音效<input type="checkbox" id="snd" checked></label>
  <div id="msg" style="font-size:12px;opacity:.9;color:#2563eb;margin-top:4px">提示：列車停靠時越安靜，停留時間越長喔！</div>
</div>

<!-- 啟動畫面 -->
<div id="start" class="modal card">
  <div style="font-size:clamp(44px, 10vw, 64px)">🚄 🟢🙂</div>
  <h2 style="margin:6px 0">安靜新幹線：慢活車站小世界</h2>
  <p style="font-size:clamp(13.5px, 3.5vw, 15.5px);line-height:1.6;opacity:.92">
    🟢🙂 保持安靜，列車會緩緩進站、打開車門，停下來陪伴大家。<br>
    🎚 進入車站前 5 秒會自動量測環境音，設定最適合您的安靜門檻。<br>
    🔴🙉 太吵雜時，車門會關上並提前離站喔。
  </p>
  <button id="go" class="go">▶ 走進車站</button>
</div>

<!-- 鐵道探索收藏館（圖鑑 Modal） -->
<div id="dex" class="modal card" hidden>
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;flex-wrap:wrap;gap:6px">
    <h3 style="margin:0">📘 鐵道探索收藏館 <span id="dexCount" style="font-size:14px;font-weight:normal"></span></h3>
    <button id="dx">✖ 關閉</button>
  </div>
  <div id="tabs" style="margin-bottom:10px"></div>
  <div id="detailBox" hidden></div>
  <div id="grid"></div>
</div>

<script>
"use strict";

// ===================== 基本工具與響應式畫布管理 (BUG-008) =====================
const $ = s => document.querySelector(s);
const cv = $('#c');
const g = cv.getContext('2d');
let W = 1, H = 1, isPortrait = true, dpr = 1;

const clamp = (v, a, b) => {
  if (!Number.isFinite(v)) return a;
  return Math.max(a, Math.min(b, v));
};
const ld = (k, d) => {
  try {
    const val = JSON.parse(localStorage.getItem(k));
    return val != null ? val : d;
  } catch (e) {
    return d;
  }
};
const sv = (k, v) => {
  try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {}
};

function resizeViewport() {
  dpr = clamp(window.devicePixelRatio || 1, 1, 2.5);
  // 精確讀取當前視口尺寸（不使用 Math.max(w, vv.width) 避免旋轉後殘留舊橫向寬度造成畫面被裁切）
  const docW = document.documentElement.clientWidth || window.innerWidth || 360;
  const docH = document.documentElement.clientHeight || window.innerHeight || 640;
  const winW = window.innerWidth || docW;
  const winH = window.innerHeight || docH;

  W = Math.max(240, Math.round(Math.min(docW, winW) || winW));
  H = Math.max(240, Math.round(Math.min(docH, winH) || winH));

  const wasPortrait = isPortrait;
  isPortrait = H >= W;

  cv.width = Math.floor(W * dpr);
  cv.height = Math.floor(H * dpr);
  cv.style.width = W + 'px';
  cv.style.height = H + 'px';
  g.setTransform(dpr, 0, 0, dpr, 0, 0);

  if (wasPortrait !== isPortrait && typeof st !== 'undefined' && st.run) {
    repositionPlatformEntities();
  }
}

function handleResizeEvent() {
  resizeViewport();
  clearTimeout(handleResizeEvent._t1);
  clearTimeout(handleResizeEvent._t2);
  handleResizeEvent._t1 = setTimeout(resizeViewport, 80);
  handleResizeEvent._t2 = setTimeout(resizeViewport, 280);
}

window.addEventListener('resize', handleResizeEvent, { passive: true });
window.addEventListener('orientationchange', handleResizeEvent, { passive: true });
if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', handleResizeEvent, { passive: true });
}
window.addEventListener('touchmove', e => {
  if (!(e.target.closest && e.target.closest('#set, #dex, #start, #dbg'))) {
    e.preventDefault();
  }
}, { passive: false });

// ===================== 車體比例與車門位置計算 =====================
const CH = () => {
  const byH = H * (isPortrait ? 0.14 : 0.23);
  const byW = W * (isPortrait ? 0.16 : 0.11);
  return clamp(Math.min(byH, byW), isPortrait ? 44 : 52, isPortrait ? 96 : 130);
};

const sceneLayout = () => {
  if (isPortrait) {
    const railY = clamp(H * 0.72, 220, H - 70);
    const hz = clamp(railY - H * 0.25, 120, railY - 60);
    return { hz, railY };
  }
  const railY = clamp(H * 0.72, 140, H - 55);
  const hz = clamp(railY - Math.min(H * 0.30, 150), 90, railY - 45);
  return { hz, railY };
};

function noseRatio(tp) {
  return { E7: 3.6, E5: 4.8, E6: 4.5, N700: 3.8, D: 3.4, P500: 5.0, ALFA: 5.8, MAG: 5.0, F800: 2.6, F: 1.8, B: 0.45, SL: 3.6 }[tp] || 3.2;
}
function carWidthRatio(tp) {
  return tp === 'B' ? 3.4 : 4.2;
}
const lenOf = (m, ch) => m.nose === 'SL' ? ch * 9.5 : (noseRatio(m.nose) + Math.min(m.cars, 6) * carWidthRatio(m.nose)) * ch;

function getVisibleDoorXs(m, hx, ch) {
  if (m.nose === 'SL') {
    const L = ch * 3.5, l = hx - L;
    return [l - ch * 0.2 - ch * 3.5 + ch * 3.1, l - ch * 0.2 - ch * 7.0 + ch * 3.1].filter(x => x > W * 0.08 && x < (isPortrait ? W * 0.90 : W * 0.82));
  }
  const NL = noseRatio(m.nose) * ch, cw = carWidthRatio(m.nose) * ch, gp = ch * 0.07, nc = Math.min(m.cars, 6);
  const doors = [];
  for (let i = 0; i < nc; i++) {
    const r = hx - NL - i * (cw + gp), l = r - cw;
    if (m.nose === 'B') {
      for (let d = 0; d < 3; d++) doors.push(l + cw * (0.10 + d * 0.32) + ch * 0.17);
    } else {
      doors.push(l + cw * 0.035 + ch * 0.12);
      if (i > 0) doors.push(r - cw * 0.035 - ch * 0.12);
    }
  }
  return doors.filter(x => x > W * 0.08 && x < (isPortrait ? W * 0.90 : W * 0.82));
}

// ===================== 繪製列車、車門與乘客剪影 (已修正 ch 未定義之致命錯誤) =====================
function traceHeadPath(c, tp, l, r, NL, top, ch) {
  const yBot = top + ch, hx = r + NL;
  c.beginPath(); c.moveTo(l, top); c.lineTo(r, top);
  if (tp === 'E7') {
    c.bezierCurveTo(r + NL * 0.22, top, r + NL * 0.42, top + ch * 0.16, r + NL * 0.58, top + ch * 0.32);
    c.bezierCurveTo(r + NL * 0.82, top + ch * 0.52, r + NL * 0.98, top + ch * 0.68, hx, top + ch * 0.79);
    c.bezierCurveTo(hx, top + ch * 0.91, r + NL * 0.86, yBot, r + NL * 0.65, yBot);
  } else if (tp === 'E5' || tp === 'E6') {
    c.bezierCurveTo(r + NL * 0.16, top, r + NL * 0.26, top + ch * 0.30, r + NL * 0.40, top + ch * 0.44);
    c.bezierCurveTo(r + NL * 0.70, top + ch * 0.52, r + NL * 0.96, top + ch * 0.65, hx, top + ch * 0.77);
    c.bezierCurveTo(hx, top + ch * 0.90, r + NL * 0.85, yBot, r + NL * 0.60, yBot);
  } else if (tp === 'N700' || tp === 'D') {
    c.bezierCurveTo(r + NL * 0.20, top, r + NL * 0.36, top + ch * 0.28, r + NL * 0.52, top + ch * 0.44);
    c.bezierCurveTo(r + NL * 0.78, top + ch * 0.55, r + NL * 0.97, top + ch * 0.68, hx, top + ch * 0.80);
    c.bezierCurveTo(hx, top + ch * 0.92, r + NL * 0.85, yBot, r + NL * 0.60, yBot);
  } else if (tp === 'P500') {
    c.bezierCurveTo(r + NL * 0.32, top + ch * 0.04, r + NL * 0.72, top + ch * 0.35, hx, top + ch * 0.68);
    c.bezierCurveTo(r + NL * 0.85, top + ch * 0.92, r + NL * 0.55, yBot, r + NL * 0.30, yBot);
  } else if (tp === 'ALFA' || tp === 'MAG') {
    c.bezierCurveTo(r + NL * 0.14, top, r + NL * 0.22, top + ch * 0.36, r + NL * 0.35, top + ch * 0.48);
    c.bezierCurveTo(r + NL * 0.68, top + ch * 0.54, r + NL * 0.96, top + ch * 0.68, hx, top + ch * 0.80);
    c.bezierCurveTo(hx, top + ch * 0.92, r + NL * 0.85, yBot, r + NL * 0.55, yBot);
  } else if (tp === 'F800' || tp === 'F') {
    c.bezierCurveTo(r + NL * 0.45, top, r + NL * 0.88, top + ch * 0.35, hx, top + ch * 0.82);
    c.bezierCurveTo(hx, top + ch * 0.94, r + NL * 0.85, yBot, r + NL * 0.50, yBot);
  } else {
    c.lineTo(r + NL * 0.4, top); c.quadraticCurveTo(hx, top + ch * 0.08, hx, top + ch * 0.88); c.lineTo(hx - NL * 0.2, yBot);
  }
  c.lineTo(l, yBot); c.closePath();
}

function drawWindowSilhouette(c, wx, wy, ww, wh, seed, t, occRatio) {
  const hash = ((seed * 9301 + 49297) % 233280) / 233280;
  if (hash > occRatio) return;
  const sway = Math.sin(t * 0.9 + seed * 1.7) * 1.1;
  const cx = wx + ww * 0.52 + sway * 0.4;
  const headY = wy + wh * 0.42;
  const r = Math.min(ww, wh) * 0.22;

  c.save();
  c.beginPath(); c.roundRect(wx, wy, ww, wh, 2); c.clip();
  c.fillStyle = 'rgba(22, 32, 46, 0.72)';
  c.beginPath(); c.arc(cx, wy + wh * 1.05, r * 1.75, Math.PI, 0); c.fill();
  c.beginPath(); c.arc(cx, headY, r, 0, Math.PI * 2); c.fill();
  if (seed % 4 === 0) {
    c.fillRect(cx - r * 1.2, headY - r * 0.85, r * 2.4, r * 0.35);
  }
  c.restore();
}

// 【修正 BUG-001 根因】使用 doorH * 0.10 取代未定義的 ch * .06
function drawAnimatedDoor(c, dx, doorY, doorW, doorH, winCol, openRatio, bodyCol) {
  if (openRatio > 0.02) {
    c.fillStyle = '#fef3c7';
    c.fillRect(dx, doorY, doorW, doorH);
    c.fillStyle = 'rgba(180, 130, 70, 0.28)';
    c.fillRect(dx, doorY, doorW, doorH * 0.10);
    c.fillStyle = '#64748b';
    c.fillRect(dx, doorY + doorH - 3, doorW, 3);
    if (openRatio > 0.4 && openRatio < 0.95) {
      c.fillStyle = 'rgba(30, 41, 59, 0.35)';
      c.beginPath(); c.arc(dx + doorW * 0.5, doorY + doorH * 0.38, doorW * 0.18, 0, Math.PI * 2); c.fill();
      c.fillRect(dx + doorW * 0.32, doorY + doorH * 0.55, doorW * 0.36, doorH * 0.42);
    }
  }

  c.save();
  c.beginPath(); c.roundRect(dx - 1, doorY, doorW + 2, doorH, 2); c.clip();
  const leafW = doorW / 2;
  const slide = openRatio * (leafW * 0.86);

  const lx = dx - slide;
  c.fillStyle = bodyCol; c.fillRect(lx, doorY, leafW, doorH);
  c.strokeStyle = 'rgba(30, 40, 55, 0.45)'; c.lineWidth = 1.1; c.strokeRect(lx, doorY, leafW, doorH);

}

function drawSteam(c, m, hx, y, ch, o) {

}

function drawTrain(c, m, hx, y, ch, o) {
  const sil = o.sil, N = o.night || 0, F = a => sil ? '#181c22' : a, t = o.t || 0, openR = o.door || 0, occ = o.occ ?? 0.68;

    const r = hx - NL - i * (cw + gp), l = r - cw;
    // 畫面外剔除優化，提升長時間運作效能
    if (r + (i === 0 ? NL : 0) < -50 || l > W + 50) continue;

    if (i < nc - 1) {
      const gx = r, gw = gp + 2;
      c.fillStyle = F('#2c323d'); c.fillRect(gx - 1, top + ch * 0.03, gw, ch * 0.92);
      if (!sil) {
        c.fillStyle = '#181c24'; c.fillRect(gx + gw * 0.25, top + ch * 0.05, gw * 0.5, ch * 0.88);
        c.strokeStyle = '#495262'; c.lineWidth = 1; c.strokeRect(gx + 1, top + ch * 0.04, gw - 2, ch * 0.90);
      }
    }
    c.fillStyle = F('#1a1e24');
    for (const bx of [l + cw * 0.16, (i === 0 ? r + NL * 0.15 : r - cw * 0.26)]) {
      c.fillRect(bx - ch * 0.32, top + ch * 0.88, ch * 0.64, ch * 0.16);
      c.fillStyle = F('#2e3440');
      c.beginPath(); c.arc(bx - ch * 0.18, y - ch * 0.04, ch * 0.075, 0, Math.PI * 2); c.arc(bx + ch * 0.18, y - ch * 0.04, ch * 0.075, 0, Math.PI * 2); c.fill();
      c.fillStyle = F('#1a1e24');
    }

    c.save();
    if (i === 0) traceHeadPath(c, m.nose, l, r, NL, top, ch);
    else { c.beginPath(); c.roundRect(l, top, cw, ch, [ch * 0.05, ch * 0.05, 0, 0]); }
    c.clip();

    const totalW = cw + (i === 0 ? NL + 4 : 2);
    c.fillStyle = F(m.body); c.fillRect(l, top, totalW, ch);
    const roofH = (m.nose === 'E5' || m.nose === 'E6') ? ch * 0.38 : ch * 0.21;
    c.fillStyle = F(m.roof); c.fillRect(l, top, totalW, roofH);

    if (!sil) {
      const hg = c.createLinearGradient(0, top, 0, top + ch * 0.35);
      hg.addColorStop(0, 'rgba(255, 255, 255, 0.28)'); hg.addColorStop(0.5, 'rgba(255, 255, 255, 0.08)'); hg.addColorStop(1, 'rgba(255, 255, 255, 0)');
      c.fillStyle = hg; c.fillRect(l, top, totalW, ch * 0.35);

    if (m.nose === 'E7') {
      c.fillStyle = F(m.st1); c.fillRect(l, top + ch * 0.21, totalW, ch * 0.055);

      c.fillStyle = F(m.st1); c.fillRect(l, top + ch * 0.60, totalW, ch * 0.03);
    } else if (m.nose === 'E5' || m.nose === 'E6' || m.nose === 'ALFA') {

    } else if (m.nose === 'N700' || m.nose === 'D') {
      c.fillStyle = F(m.st1); c.fillRect(l, top + ch * 0.53, totalW, ch * 0.055); c.fillRect(l, top + ch * 0.605, totalW, ch * 0.025);
      if (i === 0 && m.nose === 'N700') {
        c.beginPath(); c.moveTo(r, top + ch * 0.53); c.lineTo(r + NL * 0.72, top + ch * 0.72); c.lineTo(r + NL * 0.65, top + ch * 0.78); c.lineTo(r, top + ch * 0.62); c.fill();
      }
    } else if (m.nose === 'P500') {
      c.fillStyle = F(m.st1); c.fillRect(l, top + ch * 0.26, totalW, ch * 0.22);
    } else {
      c.fillStyle = F(m.st1); c.fillRect(l, top + ch * 0.52, totalW, ch * 0.08);
      if (m.st2 && m.st2 !== m.st1) { c.fillStyle = F(m.st2); c.fillRect(l, top + ch * 0.61, totalW, ch * 0.035); }
    }

    c.fillStyle = F('#d0d5dd'); c.fillRect(l, top + ch * 0.78, totalW, ch * 0.14);
    c.fillStyle = F('#2b313b'); c.fillRect(l, top + ch * 0.90, totalW, ch * 0.10);
    if (!sil) {
      c.strokeStyle = 'rgba(0, 0, 0, 0.22)'; c.lineWidth = 1.2;
      c.strokeRect(l + cw * 0.08, top + ch * 0.79, cw * 0.20, ch * 0.11);
      if (i > 0) c.strokeRect(r - cw * 0.28, top + ch * 0.79, cw * 0.20, ch * 0.11);
    }

    if (!sil) {
      const winCol = N > 0.25 ? '#ffe58f' : '#d8e8f8';
      const doorW = ch * 0.24, doorH = ch * 0.62, doorY = top + ch * 0.24;

      if (m.nose === 'B') {
        for (let d = 0; d < 3; d++) {
          const dx = l + cw * (0.10 + d * 0.32);
          const dCol = m.n.includes('山手') ? m.st1 : '#bfc6d0';
          drawAnimatedDoor(c, dx, top + ch * 0.20, ch * 0.34, ch * 0.68, winCol, openR, dCol);
          if (d < 2) {
            const wx = dx + ch * 0.40, wy = top + ch * 0.24, ww = ch * 0.52, wh = ch * 0.25;
            c.fillStyle = winCol; c.beginPath(); c.roundRect(wx, wy, ww, wh, 3); c.fill();
            drawWindowSilhouette(c, wx, wy, ww * 0.48, wh, i * 20 + d * 2 + 1, t, occ);
            drawWindowSilhouette(c, wx + ww * 0.5, wy, ww * 0.48, wh, i * 20 + d * 2 + 2, t, occ);
          }
        }
      } else {
        drawAnimatedDoor(c, l + cw * 0.035, doorY, doorW, doorH, winCol, openR, m.body);
        c.fillStyle = '#111'; c.fillRect(l + cw * 0.035 + doorW + ch * 0.03, doorY + ch * 0.08, ch * 0.17, ch * 0.06);
        c.fillStyle = '#ff9900'; c.fillRect(l + cw * 0.035 + doorW + ch * 0.04, doorY + ch * 0.095, ch * 0.13, ch * 0.03);
        if (i > 0) {

        }

        const wStart = l + cw * 0.14, wEnd = i === 0 ? r - cw * 0.08 : r - cw * 0.14;

          c.beginPath(); c.moveTo(wx + 2, wY + 2); c.lineTo(wx + wW * 0.55, wY + 2); c.lineTo(wx + wW * 0.25, wY + wH - 2); c.lineTo(wx + 2, wY + wH - 2); c.fill();
        }

          c.fillStyle = winCol; c.fillRect(r - ch * 0.08, top + ch * 0.16, NL * 0.7, ch * 0.28);
        } else {
          const cdx = r - ch * 0.18;
          c.strokeStyle = 'rgba(30, 40, 55, 0.5)'; c.lineWidth = 1.2; c.strokeRect(cdx, top + ch * 0.26, ch * 0.15, ch * 0.56);
          c.fillStyle = winCol; c.fillRect(cdx + ch * 0.03, top + ch * 0.30, ch * 0.09, ch * 0.14);

          if (m.nose === 'E7' || m.nose === 'P500') {

            c.lineTo(r + NL * 0.42, top + ch * 0.34); c.quadraticCurveTo(r + NL * 0.22, top + ch * 0.22, r + NL * 0.05, top + ch * 0.24);
          } else if (m.nose === 'E5' || m.nose === 'E6' || m.nose === 'ALFA' || m.nose === 'MAG') {

            c.lineTo(r + NL * 0.26, top + ch * 0.41); c.quadraticCurveTo(r + NL * 0.14, top + ch * 0.24, r + NL * 0.02, top + ch * 0.23);

            c.lineTo(r + NL * 0.36, top + ch * 0.42); c.quadraticCurveTo(r + NL * 0.18, top + ch * 0.28, r + NL * 0.06, top + ch * 0.26);
          }
          c.closePath(); c.fill();
          c.strokeStyle = 'rgba(190, 225, 255, 0.55)'; c.lineWidth = 2; c.stroke();
          c.fillStyle = m.st1; c.beginPath(); c.roundRect(r - ch * 0.55, top + ch * 0.33, ch * 0.26, ch * 0.12, 2); c.fill();

        c.fillStyle = '#fffbe0'; c.beginPath(); c.ellipse(lx + ch * 0.02, ly, ch * 0.07, ch * 0.038, 0.25, 0, Math.PI * 2); c.fill();

// ===================== 車站小世界：特色旅客與站務員 =====================
function drawPerson(c, p, platY, ch, t) {
  if (p.alpha <= 0.02) return;
  c.save();
  c.globalAlpha = clamp(p.alpha, 0, 1);
  const h = ch * 0.44 * (p.scale || 1);
  const x = p.x, y = platY;
  const dir = p.dir || 1;
  const walkPhase = p.walking ? Math.sin(t * 3.6 + p.seed) * 0.22 : 0;
  const bob = p.walking ? Math.abs(Math.sin(t * 3.6 + p.seed)) * 1.2 : 0;

  c.strokeStyle = '#1e293b'; c.lineWidth = Math.max(2, h * 0.11); c.lineCap = 'round';
  c.beginPath();
  c.moveTo(x - h * 0.07, y - h * 0.38); c.lineTo(x - h * 0.07 - Math.sin(walkPhase) * h * 0.18, y);
  c.moveTo(x + h * 0.07, y - h * 0.38); c.lineTo(x + h * 0.07 + Math.sin(walkPhase) * h * 0.18, y);
  c.stroke();

  if (p.role === 'hiker') {
    c.fillStyle = '#92400e'; c.beginPath(); c.roundRect(x - dir * h * 0.28, y - h * 0.82 - bob, h * 0.24, h * 0.42, 4); c.fill();
    c.fillStyle = '#f59e0b'; c.beginPath(); c.roundRect(x - dir * h * 0.28, y - h * 0.86 - bob, h * 0.24, h * 0.10, 3); c.fill();
  } else if (p.role === 'skier') {
    c.save(); c.translate(x - dir * h * 0.12, y - h * 0.58 - bob); c.rotate(-dir * 0.28);
    c.fillStyle = '#38bdf8'; c.fillRect(-2, -h * 0.55, 4.5, h * 1.05);
    c.fillStyle = '#0284c7'; c.fillRect(-2, -h * 0.55, 4.5, h * 0.18);
    c.restore();
  }

  c.fillStyle = p.color;
  c.beginPath(); c.roundRect(x - h * 0.17, y - h * 0.78 - bob, h * 0.34, h * 0.44, [h * 0.12, h * 0.12, 3, 3]); c.fill();

  if (p.role === 'staff') {
    c.fillStyle = '#fbbf24'; c.fillRect(x - h * 0.17, y - h * 0.56 - bob, h * 0.34, 2);
  }

  c.fillStyle = '#fde68a'; c.beginPath(); c.arc(x, y - h * 0.91 - bob, h * 0.13, 0, Math.PI * 2); c.fill();

  if (p.role === 'staff') {
    c.fillStyle = '#1e3a8a'; c.fillRect(x - h * 0.14, y - h * 1.08 - bob, h * 0.28, h * 0.10);
    c.fillStyle = '#ffffff'; c.fillRect(x - h * 0.14, y - h * 1.01 - bob, h * 0.28, h * 0.025);
    c.fillStyle = '#172554'; c.fillRect(x - h * 0.16, y - h * 0.99 - bob, h * 0.34, h * 0.03);
  } else if (p.role === 'hiker') {
    c.fillStyle = '#78716c'; c.beginPath(); c.ellipse(x, y - h * 1.0 - bob, h * 0.21, h * 0.045, 0, 0, Math.PI * 2); c.fill();
    c.beginPath(); c.arc(x, y - h * 1.0 - bob, h * 0.12, Math.PI, 0); c.fill();
  } else if (p.role === 'skier') {
    c.fillStyle = '#e11d48'; c.beginPath(); c.arc(x, y - h * 0.96 - bob, h * 0.135, Math.PI, 0); c.fill();
    c.fillStyle = '#fff'; c.beginPath(); c.arc(x, y - h * 1.12 - bob, h * 0.05, 0, Math.PI * 2); c.fill();
  } else if (p.role === 'beach') {
    c.fillStyle = '#fcd34d'; c.beginPath(); c.ellipse(x, y - h * 1.0 - bob, h * 0.22, h * 0.045, 0, 0, Math.PI * 2); c.fill();
    c.beginPath(); c.arc(x, y - h * 1.0 - bob, h * 0.12, Math.PI, 0); c.fill();
    c.fillStyle = '#ef4444'; c.fillRect(x - h * 0.11, y - h * 1.02 - bob, h * 0.22, h * 0.025);
  } else {
    c.fillStyle = '#334155'; c.beginPath(); c.arc(x, y - h * 0.94 - bob, h * 0.135, Math.PI * 0.9, Math.PI * 2.1); c.fill();
  }

  if (p.waving) {
    const waveAng = -2.2 + Math.sin(t * 3.2 + p.seed) * 0.25;
    const ax = x + dir * h * 0.12, ay = y - h * 0.72 - bob;
    const hx2 = ax + Math.cos(waveAng) * h * 0.26, hy2 = ay + Math.sin(waveAng) * h * 0.26;
    c.strokeStyle = p.color; c.lineWidth = Math.max(2.2, h * 0.09);
    c.beginPath(); c.moveTo(ax, ay); c.lineTo(hx2, hy2); c.stroke();
    c.fillStyle = p.role === 'staff' ? '#ffffff' : '#fde68a';
    c.beginPath(); c.arc(hx2, hy2, h * 0.045, 0, Math.PI * 2); c.fill();
  } else {
    const handX = x + dir * h * 0.14 + Math.sin(walkPhase) * h * 0.08;
    const handY = y - h * 0.48 - bob;
    c.strokeStyle = p.color; c.lineWidth = Math.max(2, h * 0.09);
    c.beginPath(); c.moveTo(x + dir * h * 0.08, y - h * 0.70 - bob); c.lineTo(handX, handY); c.stroke();

    if (p.role === 'hiker') {
      c.strokeStyle = '#57534e'; c.lineWidth = 1.8;
      c.beginPath(); c.moveTo(handX + dir * h * 0.06, y - h * 0.68 - bob); c.lineTo(handX + dir * h * 0.10, y); c.stroke();
    } else if (p.role === 'commuter') {
      c.fillStyle = '#451a03'; c.beginPath(); c.roundRect(handX - h * 0.11, handY, h * 0.22, h * 0.16, 2); c.fill();
    } else if (p.role === 'beach') {
      c.fillStyle = '#0ea5e9'; c.beginPath(); c.roundRect(handX - h * 0.08, handY, h * 0.16, h * 0.15, 3); c.fill();
    } else if (p.role === 'onsen') {
      c.fillStyle = '#d97706'; c.beginPath(); c.roundRect(handX - h * 0.09, handY, h * 0.18, h * 0.14, 4); c.fill();
    } else if (p.role === 'star') {
      c.fillStyle = '#fef08a'; c.beginPath(); c.arc(handX + dir * h * 0.06, handY + h * 0.06, h * 0.06, 0, Math.PI * 2); c.fill();
    }
  }
  c.restore();
}

function initWaitingPassengers() {
  const scObj = SCENES[st.sc] || SCENES[0];
  st.pax = [0, 1].map(k => ({
    x: W * (0.28 + k * 0.24),
    targetX: W * (0.28 + k * 0.24),
    dir: 1,
    walking: false,
    waving: false,
    alpha: 1,
    state: 'wait_board',
    delay: 1.8 + k * 2.4,
    role: scObj.role,
    color: scObj.colors[k % scObj.colors.length],
    seed: k * 13 + 1
  }));
  st.staff.x = W * 0.78;
  st.staff.dir = -1;
  st.staff.waving = false;
  st.staff.walking = false;
}

function repositionPlatformEntities() {
  st.pax.forEach((p, idx) => {
    p.x = clamp(p.x, W * 0.15, W * 0.80);
    p.targetX = clamp(p.targetX, W * 0.15, W * 0.80);
  });
  st.staff.x = clamp(st.staff.x, W * 0.70, W * 0.84);

  }
}

// ===================== 音訊架構、環境音校正與 10 秒自動恢復 (BUG-002 ~ BUG-006) =====================
let audioCtx = null;
let analyserNode = null;
let micStream = null;
let micSource = null;
let silentKeepaliveGain = null;
let freqDataBuf = null;
const floatTimeBuf = new Float32Array(2048);
const byteTimeBuf = new Uint8Array(2048);
const volHistory = [];
const VOL_HIST_LEN = 5;

let lastValidAudioTime = performance.now();
let lastVolumeUIUpdateTime = performance.now();
let isRecoveringAudio = false;
let audioErrorCount = 0;
let lastAudioErrorMsg = 'None';
let audioSystemStoppedAlert = false;

function logAudioError(tag, err) {
  audioErrorCount++;
  const msg = err && err.message ? err.message : String(err);
  lastAudioErrorMsg = `[${tag}] ${msg}`;
  console.warn('[AudioSystem]', lastAudioErrorMsg);
}

// 單一常駐 AudioContext（音效與麥克風共用，避免 iOS 雙 Context 衝突中斷）
function getOrCreateAudioContext() {
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return null;
  if (!audioCtx || audioCtx.state === 'closed') {
    audioCtx = new AC();
  }
  if (audioCtx.state === 'suspended' || audioCtx.state === 'interrupted') {
    audioCtx.resume().catch(e => logAudioError('resume', e));
  }
  return audioCtx;
}

// 溫和木琴音效（共用同一個常駐 AudioContext）
function chime(freqs) {
  if (!$('#snd').checked) return;
  try {
    const a = getOrCreateAudioContext();
    if (!a) return;
    const list = Array.isArray(freqs) ? freqs : [freqs];
    list.forEach((f, idx) => {
      const o = a.createOscillator();
      const v = a.createGain();
      o.type = 'sine';
      o.frequency.value = f;
      o.connect(v);
      v.connect(a.destination);
      const t0 = a.currentTime + idx * 0.22;
      v.gain.setValueAtTime(0.04, t0);
      v.gain.exponentialRampToValueAtTime(0.0008, t0 + 0.90);
      o.start(t0);
      o.stop(t0 + 0.92);
    });
  } catch (e) {
    logAudioError('chime', e);
  }
}

async function setupMicrophoneGraph(forceNewStream = false) {
  const a = getOrCreateAudioContext();
  if (!a) throw new Error('Web Audio API not supported');
  await a.resume().catch(() => {});

  const hasLiveTrack = micStream && micStream.getAudioTracks().some(t => t.readyState === 'live' && !t.muted);
  if (forceNewStream || !hasLiveTrack) {
    const constraintsList = [
      { audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false, channelCount: 1 } },
      { audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: true } },
      { audio: true }
    ];
    let newStream = null, lastErr = null;
    for (const c of constraintsList) {
      try {
        newStream = await navigator.mediaDevices.getUserMedia(c);
        if (newStream) break;
      } catch (e) {
        lastErr = e;
      }
    }
    if (!newStream) throw lastErr || new Error('getUserMedia failed');

    const oldStream = micStream;
    micStream = newStream;
    micStream.getAudioTracks().forEach(t => {
      t.enabled = true;
      t.onended = () => {
        logAudioError('track.onended', 'Microphone track ended unexpectedly');
      };
    });

    if (oldStream && oldStream !== newStream) {
      oldStream.getTracks().forEach(t => { try { t.stop(); } catch (e) {} });
    }
  }

  try { if (micSource) micSource.disconnect(); } catch (e) {}
  try { if (silentKeepaliveGain) silentKeepaliveGain.disconnect(); } catch (e) {}

  analyserNode = a.createAnalyser();
  analyserNode.fftSize = 2048;
  analyserNode.smoothingTimeConstant = 0.22;
  analyserNode.minDecibels = -90;
  analyserNode.maxDecibels = -10;

  micSource = a.createMediaStreamSource(micStream);
  micSource.connect(analyserNode);

  // 靜音 Keep-Alive 節點連接至 destination，確保 iOS WebKit 不會因為無輸出而把輸入管線休眠
  silentKeepaliveGain = a.createGain();
  silentKeepaliveGain.gain.value = 0;
  analyserNode.connect(silentKeepaliveGain);
  silentKeepaliveGain.connect(a.destination);

  st.mic = true;
  audioSystemStoppedAlert = false;
  lastValidAudioTime = performance.now();
  return true;
}

// BUG-005：麥克風自動恢復機制（當異常超過 10 秒時自動重建 AudioContext -> AnalyserNode -> 重新取得麥克風）
async function recoverAudioSystem(reason) {
  if (isRecoveringAudio) return;
  isRecoveringAudio = true;
  audioSystemStoppedAlert = true;
  logAudioError('AutoRecover', reason);
  try {
    if (audioCtx && audioCtx.state === 'closed') {
      audioCtx = null;
    }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!audioCtx) {
      audioCtx = new AC();
    } else if (audioCtx.state === 'suspended' || audioCtx.state === 'interrupted') {
      await audioCtx.resume().catch(() => {});
    }
    await setupMicrophoneGraph(true);
    lastValidAudioTime = performance.now();
    audioSystemStoppedAlert = false;
    $('#msg').textContent = '🔄 音訊系統已自動恢復監聽';
  } catch (e) {
    logAudioError('RecoverFailed', e);
  } finally {
    isRecoveringAudio = false;
  }
}

// BUG-003：安全音訊偵測（無論吶喊、拍手、破音多大，絕不產生 NaN 或當機）
function detectVolume() {
  if (!st.mic || !analyserNode || !audioCtx) {
    return st.sim ? 78 : (12 + Math.sin(performance.now() * 0.003) * 1.5);
  }
  try {
    if (audioCtx.state === 'suspended' || audioCtx.state === 'interrupted') {
      audioCtx.resume().catch(() => {});
    }

    // 1. Float32 時間域取樣
    let fSum = 0, fPeak = 0, hasNonZeroFloat = false;
    try {
      analyserNode.getFloatTimeDomainData(floatTimeBuf);
      for (let i = 0; i < floatTimeBuf.length; i++) {
        const val = floatTimeBuf[i];
        if (!Number.isFinite(val)) continue;
        if (val !== 0) hasNonZeroFloat = true;
        const clampedVal = clamp(val, -1.0, 1.0);
        fSum += clampedVal * clampedVal;
        const absV = Math.abs(clampedVal);
        if (absV > fPeak) fPeak = absV;
      }
    } catch (e) {}
    const fRms = Math.sqrt(fSum / floatTimeBuf.length);

    // 2. Uint8 時間域取樣（相容所有舊款或特殊行動裝置）
    analyserNode.getByteTimeDomainData(byteTimeBuf);
    let bSum = 0, bPeak = 0, hasWaveVariation = false;
    const firstByte = byteTimeBuf[0];
    for (let i = 0; i < byteTimeBuf.length; i++) {
      const b = byteTimeBuf[i];
      if (b !== firstByte) hasWaveVariation = true;
      const norm = (b - 128) / 128;
      bSum += norm * norm;
      const absB = Math.abs(norm);
      if (absB > bPeak) bPeak = absB;
    }
    const bRms = Math.sqrt(bSum / byteTimeBuf.length);

    // 3. 頻域能量（人聲與拍手頻段 120Hz ~ 5000Hz）
    if (!freqDataBuf || freqDataBuf.length !== analyserNode.frequencyBinCount) {
      freqDataBuf = new Uint8Array(analyserNode.frequencyBinCount);
    }
    analyserNode.getByteFrequencyData(freqDataBuf);
    let freqEnergySum = 0, freqCount = 0;
    const sampleRate = (audioCtx && audioCtx.sampleRate) ? audioCtx.sampleRate : 44100;
    const binHz = sampleRate / analyserNode.fftSize;
    for (let i = 0; i < freqDataBuf.length; i++) {
      const hz = i * binHz;
      if (hz >= 120 && hz <= 5000) {
        freqEnergySum += freqDataBuf[i];
        freqCount++;
      }
    }
    const freqAvg = freqCount > 0 ? (freqEnergySum / freqCount) : 0;

    // 只要硬體有微小電子底噪波動或非全零訊號，即更新有效時間戳記
    if (hasNonZeroFloat || hasWaveVariation || freqAvg > 0) {
      lastValidAudioTime = performance.now();
    }

    const combinedRms = Math.max(fRms, bRms, 1e-7);
    const combinedPeak = Math.max(fPeak, bPeak, 1e-7);

    // 將 RMS、Peak、頻譜換算為 0 ~ 100 的直覺分貝刻度
    const dbFromRms = clamp((20 * Math.log10(combinedRms) + 82) * 1.35, 0, 100);
    const dbFromPeak = clamp((20 * Math.log10(combinedPeak) + 72) * 1.30, 0, 100);
    const dbFromFreq = clamp(freqAvg * 0.62, 0, 100);

    const rawDb = clamp(Math.max(dbFromRms, dbFromPeak * 0.9, dbFromFreq), 0, 100);
    volHistory.push(rawDb);
    if (volHistory.length > VOL_HIST_LEN) volHistory.shift();

    // 取近期較高反應值，確保拍手與大吼瞬間立刻反映，同時過濾單一雜訊點
    const sorted = volHistory.slice().sort((a, b) => a - b);
    const pickIdx = Math.min(sorted.length - 1, Math.floor(sorted.length * 0.65));
    const result = sorted[pickIdx];
    return Number.isFinite(result) ? clamp(result, 0, 100) : 0;
  } catch (e) {
    logAudioError('detectVolume', e);
    return 0;
  }
}

// BUG-006：開始 5 秒環境噪音自動校正
function startEnvironmentCalibration() {
  st.calibrating = true;
  st.calibStartTime = performance.now();
  st.calibSamples = [];
  $('#msg').textContent = '🎚 正在進行 5 秒環境音自動校正…請保持日常安靜';
}

function updateEnvironmentCalibration() {
  if (!st.calibrating) return;
  const elapsed = (performance.now() - st.calibStartTime) / 1000;
  if (Number.isFinite(st.currentVolume)) {
    st.calibSamples.push(st.currentVolume);
  }
  if (elapsed >= 5.0) {
    st.calibrating = false;
    if (st.calibSamples.length > 5) {
      const sorted = st.calibSamples.slice().sort((a, b) => a - b);
      // 取 15% ~ 75% 區間平均作為穩定環境底噪（排除偶發咳嗽或關門聲）
      const lo = Math.floor(sorted.length * 0.15);
      const hi = Math.max(lo + 1, Math.floor(sorted.length * 0.75));
      const slice = sorted.slice(lo, hi);
      const avgEnv = slice.reduce((a, b) => a + b, 0) / slice.length;
      st.environmentNoise = clamp(Math.round(avgEnv), 8, 60);
    } else {
      st.environmentNoise = 20;
    }
    // 依據環境音自動計算 silenceThreshold
    st.silenceThreshold = clamp(st.environmentNoise + st.thresholdMargin, 18, 85);
    $('#goal').value = String(Math.round(st.silenceThreshold));
    st.acc = 0;
    st.loud = false;
    st.quiet = 1;
    refreshThresholdUI();
    $('#msg').textContent = `✅ 環境音校正完成（環境 ${st.environmentNoise} dB / 門檻 ${st.silenceThreshold} dB）`;
  }
}

// BUG-002：更新麥克風音量與自動恢復檢查（整個生命週期每幀執行，絕不中斷）
function updateMicMeter(dt) {
  const rawVol = st.sim ? 85 : detectVolume();
  st.currentVolume = clamp(rawVol, 0, 100);

  // 防 NaN 保護
  if (!Number.isFinite(st.lvlFast)) st.lvlFast = st.currentVolume;
  if (!Number.isFinite(st.lvl)) st.lvl = st.currentVolume;

  const fastRate = st.currentVolume > st.lvlFast ? Math.min(1, dt * 22) : Math.min(1, dt * 10);
  st.lvlFast = clamp(st.lvlFast + (st.currentVolume - st.lvlFast) * fastRate, 0, 100);

  const smoothRate = st.currentVolume > st.lvl ? Math.min(1, dt * 9) : Math.min(1, dt * 4.5);
  st.lvl = clamp(st.lvl + (st.currentVolume - st.lvl) * smoothRate, 0, 100);

  if (st.calibrating) {
    updateEnvironmentCalibration();
  }

  // BUG-005：檢查是否超過 10 秒無回應、Track 斷線或 Context Suspended
  if (st.run && st.mic && !isRecoveringAudio) {
    const now = performance.now();
    const acSuspended = !audioCtx || audioCtx.state === 'suspended' || audioCtx.state === 'closed' || audioCtx.state === 'interrupted';
    const trackDead = !micStream || !micStream.getAudioTracks().some(t => t.readyState === 'live' && !t.muted);
    const signalStalled = (now - lastValidAudioTime) > 10000;
    const uiStalled = (now - lastVolumeUIUpdateTime) > 10000;

    if (trackDead || signalStalled || uiStalled || (acSuspended && (now - lastValidAudioTime) > 10000)) {
      lastValidAudioTime = now; // 避免重複觸發
      recoverAudioSystem(
        trackDead ? 'Microphone Disconnected' :
        acSuspended ? 'AudioContext Suspended' :
        'Volume Signal Stalled > 10s'
      );
    }
  }
}

// BUG-002：更新分貝條與數值 UI（獨立函式，確保每幀更新不消失）
function updateVolumeBar() {
  lastVolumeUIUpdateTime = performance.now();
  const displayDb = Math.round(clamp(st.lvlFast, 0, 100));
  const threshold = clamp(st.silenceThreshold, 12, 85);

  const volFill = $('#volFill');
  const volGoal = $('#volGoal');
  const volNum = $('#volNum');

  if (volFill) volFill.style.width = clamp(displayDb, 0, 100) + '%';
  if (volGoal) volGoal.style.left = clamp(threshold, 0, 100) + '%';
  if (volNum) volNum.textContent = displayDb + ' dB';

  const lr = $('#lvlReadout');
  if (lr) {
    const stateTag = st.loud ? '環境太吵 🔴' : (displayDb > threshold * 0.85 ? '注意 🟡' : '安靜 🟢');
    lr.textContent = `${displayDb} dB / 門檻 ${threshold} dB (${stateTag})`;
  }
}

// ===================== BUG-007：iPhone / 平板防黑畫面休眠 (Screen Wake Lock API) =====================
let wakeLockSentinel = null;

async function requestScreenWakeLock() {
  const banner = $('#wakeBanner');
  if (!('wakeLock' in navigator)) {
    if (banner) banner.hidden = false;
    return false;
  }
  try {
    if (wakeLockSentinel) return true;
    wakeLockSentinel = await navigator.wakeLock.request('screen');
    if (banner) banner.hidden = true;
    wakeLockSentinel.addEventListener('release', () => {
      wakeLockSentinel = null;
    });
    return true;
  } catch (e) {
    if (banner) banner.hidden = false;
    return false;
  }
}

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && st.run) {
    getOrCreateAudioContext();
    requestScreenWakeLock();
    // 檢查麥克風軌道是否因背景切換被系統關閉
    const hasLive = micStream && micStream.getAudioTracks().some(t => t.readyState === 'live');
    if (st.mic && !hasLive) {
      recoverAudioSystem('Visibility Restored Track Dead');
    }
  }
});

// ===================== 列車生成與狀態機管理 (BUG-001) =====================
const bd = b => [...Array(10).keys()].every(k => seen[b * 10 + k]);
const nd = () => [0, 1, 2].filter(bd).length;
const unl = () => Math.min(6, 1 + 2 * nd());

function pickTrainIndex() {
  const b = [0, 1, 2].find(x => !bd(x));
  if (b == null && !seen[30]) return 30;
  const un = b == null ? [] : [...Array(10).keys()].map(k => b * 10 + k).filter(i => !seen[i]);
  if (!Object.keys(seen).length) return 0;
  if (un.length && Math.random() < 0.78) {
    const w = un.map(i => [1, 1, 0.85, 0.6, 0.35][M[i].r] || 0.5);
    let r = Math.random() * w.reduce((a, c) => a + c, 0), k = 0;
    for (; k < un.length - 1 && (r -= w[k]) >= 0; k++);
    return un[k];
  }
  const sn = Object.keys(seen).map(Number);
  return sn.length ? sn[Math.random() * sn.length | 0] : 0;
}

function spawnTrain() {
  const idx = pickTrainIndex();
  const baseDwell = +$('#dwellT').value || 30;
  st.trainCount++;
  st.tr = {
    i: idx,
    x: -30,
    ph: 'in',
    t: 0,
    v: 0,
    door: 0,
    occ: 0.65,
    baseDwell: baseDwell,
    maxDwell: baseDwell,
    chimePlayed: false
  };
  // 同步設定所有列車狀態旗標
  st.trainActive = true;
  st.isTrainRunning = true;
  st.rewardRunning = true;
  st.stationPlaying = false;
  st.silenceTimer = 0;
  st.first = false;
  st.cue = false;
}

function showCornerCard(m, isNew) {
  $('#ccStatus').textContent = isNew ? '✨ 新車進站收錄' : '✅ 已收錄列車 (第' + seen[m.id] + '次停靠)';
  $('#ccStatus').style.color = isNew ? '#b45309' : '#15803d';
  $('#ccType').textContent = m.trk === 'V' ? '高架新幹線' : (m.trk === 'M' ? '超電導磁浮' : '在來線・台鐵');
  $('#ccName').textContent = m.n;
  $('#ccStars').textContent = '⭐'.repeat(m.r);
  $('#ccRoute').textContent = '📍 ' + m.route;
  $('#cornerCard').classList.add('show');
  st.ccTimer = 7.0;
}

function onTrainArriveStation() {
  const T = st.tr;
  if (!T) return;
  const i = T.i, m = M[i], isNew = !seen[i];
  seen[i] = (seen[i] || 0) + 1;
  sv('ak_s', seen);

  st.stationPlaying = true;
  showCornerCard(m, isNew);
  if (isNew) {
    $('#badge').hidden = false;
    chime([440, 554, 659]);
  } else {
    chime([440, 554]);
  }

  const ch = CH(), sx = isPortrait ? W * 0.92 : W * 0.86;
  const doors = getVisibleDoorXs(m, sx, ch);
  const scObj = SCENES[st.sc] || SCENES[0];

  if (doors.length > 0) {
    st.pax.forEach((p, idx) => {
      p.targetX = doors[idx % doors.length];
      p.state = 'wait_board';
      p.delay = 2.2 + idx * 2.0;
    });

    for (let k = 0; k < 2; k++) {
      const dX = doors[(k + 1) % doors.length];
      const restSpot = clamp(dX + (k % 2 === 0 ? -ch * 1.1 : ch * 1.1), W * 0.16, W * 0.76);
      st.pax.push({
        x: dX,
        targetX: restSpot,
        dir: restSpot > dX ? 1 : -1,
        walking: false,
        waving: false,
        alpha: 0,
        state: 'wait_alight',
        delay: 2.0 + k * 2.6,
        role: scObj.role,
        color: scObj.colors[(k + 2) % scObj.colors.length],
        seed: (k + 3) * 19
      });
    }
  }

  const b = i / 10 | 0;
  if (i < 30 && bd(b) && !cd[b]) {
    cd[b] = 1;
    sv('ak_c', cd);
    st.page = { t: 0 };
    st.pend = 1 + 2 * b;
  }
}

// 【BUG-001 關鍵】列車結束後徹底重置所有狀態，確保第二台、第 N 台列車無限循環生成
function endTrain() {
  st.tr = null;
  st.trainActive = false;
  st.isTrainRunning = false;
  st.rewardRunning = false;
  st.stationPlaying = false;
  st.silenceTimer = 0;
  st.first = false;
  st.cue = false;

  // 重置吵鬧累積，避免卡死在噪音狀態
  st.loud = false;
  st.loudT = 0;
  st.acc = 0;
  st.quiet = 1;
  $('#dwellHint').hidden = true;

  // 限制月台旅客陣列長度，防止長時間掛機記憶體洩漏 (BUG-009)
  const scObj = SCENES[st.sc] || SCENES[0];
  st.pax = st.pax.filter(p => p.alpha > 0.5).slice(0, 2);
  while (st.pax.length < 2) {
    const k = st.pax.length;
    st.pax.push({
      x: W * (0.28 + k * 0.24),
      targetX: W * (0.28 + k * 0.24),
      dir: 1,
      walking: false,
      waving: false,
      alpha: 1,
      state: 'wait_board',
      delay: 2.0 + k * 2.0,
      role: scObj.role,
      color: scObj.colors[k % scObj.colors.length],
      seed: (st.trainCount * 7 + k * 13) % 997
    });
  }
  st.pax.forEach((p, idx) => {
    p.waving = false;
    p.walking = false;
    p.alpha = 1;
    p.state = 'wait_board';
    p.delay = 2.2 + idx * 2.0;
  });
  st.staff.waving = false;
  st.staff.walking = false;

  if (st.pend != null) {
    triggerSceneFade(st.pend);
    st.pend = null;
  }
}

const triggerSceneFade = i => {
  if (!st.fade) st.fade = { t: 0, n: i, sw: 0 };
};

// ===================== 遊戲核心更新迴圈 =====================
function updateGameLogic(dt) {
  st.t += dt;
  const ch = CH();

  if (st.ccTimer > 0) {
    st.ccTimer -= dt;
    if (st.ccTimer <= 0) $('#cornerCard').classList.remove('show');
  }

  // 1. 永遠先更新麥克風與分貝條 (BUG-002)
  updateMicMeter(dt);
  updateVolumeBar();

  if (st.run) {
    const threshold = clamp(st.silenceThreshold, 12, 85);
    const over = st.lvl - threshold;

    if (over > 0) {
      const intensity = clamp(over / 15, 0.2, 2.5);
      st.acc = clamp(st.acc + dt * (0.8 + 2.2 * intensity), 0, 12);
      st.quiet = 0;
    } else {
      st.quiet += dt;
      st.acc = Math.max(0, st.acc - dt * 3.2);
    }

    if (!st.loud && st.acc >= 2.2) {
      st.loud = true;
      st.loudT = 0;
    }
    if (st.loud && st.quiet >= 1.0) {
      st.loud = false;
      st.acc = 0;
      st.loudT = 0;
    }

    const isWarn = !st.loud && (st.lvl > threshold * 0.85 || st.acc > 0.7);
    const waitInterval = st.first ? 4.0 : (+$('#rate').value || 15);

    if (st.loud) {
      st.loudT += dt;
    } else {
      if (!st.tr) {
        st.silenceTimer += dt * (isWarn ? 0.45 : 1.0);
      }
      st.scT += dt;
    }

    // 更新左上角燈號與倒數顯示
    const lampEl = $('#lamp'), lampTxt = $('#lampTxt'), lampBar = $('#lampBar'), lampCd = $('#lampCountdown');
    if (!st.tr) {
      const remainSec = Math.max(0, Math.ceil(waitInterval - st.silenceTimer));
      const prog = clamp((st.silenceTimer / waitInterval) * 100, 0, 100);
      lampBar.style.width = prog + '%';
      lampCd.textContent = st.calibrating ? '校正中' : `${remainSec}s`;
      $('#dwellHint').hidden = true;
    } else if (st.tr.ph === 'stop') {
      const remainStay = Math.max(0, Math.ceil(st.tr.maxDwell - st.tr.t));
      const remainPct = clamp((1 - st.tr.t / st.tr.maxDwell) * 100, 0, 100);
      lampBar.style.width = remainPct + '%';
      lampCd.textContent = `停靠 ${remainStay}s`;
      $('#dwellHint').hidden = st.loud || isWarn;
    } else {
      lampBar.style.width = '100%';
      lampCd.textContent = st.tr.ph === 'in' ? '進站中' : '離站中';
      $('#dwellHint').hidden = true;
    }

    if (st.loud) {
      lampTxt.textContent = '🔴🙉';
      lampEl.style.borderColor = '#ef4444';
      lampBar.style.background = '#ef4444';
    } else if (isWarn) {
      lampTxt.textContent = '🟡😐';
      lampEl.style.borderColor = '#f59e0b';
      lampBar.style.background = '#f59e0b';
    } else {
      lampTxt.textContent = '🟢🙂';
      lampEl.style.borderColor = '#4ade80';
      lampBar.style.background = '#22c55e';
    }

    // 候車倒數達標 -> 生成列車
    st.cue = !st.tr && st.silenceTimer >= Math.max(0, waitInterval - 3.5);
    if (!st.tr && !st.loud && st.silenceTimer >= waitInterval) {
      spawnTrain();
    }

    // 列車四階段狀態機
    const T = st.tr;
    if (T) {
      const m = M[T.i], L = lenOf(m, ch), sx = isPortrait ? W * 0.92 : W * 0.86;

      // 環境太吵超過 3.5 秒：提前關門離站或退回
      if (st.loud && st.loudT > 3.5) {
        if (T.ph === 'in') {
          T.ph = 'back';
          $('#cornerCard').classList.remove('show');
        } else if (T.ph === 'stop' && T.t < T.maxDwell - 3.5) {
          T.t = T.maxDwell - 3.5;
        }
      }

      if (T.ph === 'in') {
        st.isTrainRunning = true;
        st.stationPlaying = false;
        const dist = sx - T.x;
        const spd = clamp(dist * 0.45, W * 0.03, W * 0.16);
        T.x += (st.loud ? spd * 0.25 : spd) * dt;
        if (dist <= 2.5) {
          T.x = sx;
          T.ph = 'stop';
          T.t = 0;
          onTrainArriveStation();
        }
      } else if (T.ph === 'stop') {
        st.isTrainRunning = true;
        st.stationPlaying = true;
        T.t += dt;
        if (!st.loud && !isWarn && T.maxDwell < T.baseDwell + 20) {
          T.maxDwell += dt * 0.35;
        }

        const closeStart = T.maxDwell - 3.5;
        if (T.t > 1.0 && T.t < closeStart) {
          T.door = Math.min(1, T.door + dt * 0.75);
        } else if (T.t >= closeStart) {
          if (!T.chimePlayed) {
            T.chimePlayed = true;
            chime([523, 659]);
          }
          T.door = Math.max(0, T.door - dt * 0.75);
        }

        if (T.t >= T.maxDwell && T.door <= 0.01) {
          T.door = 0;
          T.ph = 'out';
          T.v = W * 0.015;
          st.stationPlaying = false;
          st.staff.waving = true;
          st.staff.walking = false;
          st.pax.forEach((p, idx) => { if (p.alpha > 0.8 && idx % 2 === 0) p.waving = true; });
        }
      } else if (T.ph === 'out') {
        st.isTrainRunning = true;
        st.stationPlaying = false;
        T.v = Math.min(W * 0.26, T.v + W * 0.036 * dt);
        T.x += T.v * dt;
        if (T.x - L > W + 60) {
          endTrain();
        }
      } else if (T.ph === 'back') {
        st.isTrainRunning = true;
        st.stationPlaying = false;
        T.door = Math.max(0, T.door - dt * 1.2);
        T.x -= W * 0.20 * dt;
        if (T.x < -50) {
          endTrain();
        }
      }
    }

    // 月台旅客與站務員慢動作更新
    const walkSpeed = clamp(W * 0.03, 24, 42);
    st.pax.forEach(p => {
      if (st.tr && st.tr.ph === 'stop' && st.tr.door > 0.75) {
        if (p.state === 'wait_board') {
          p.delay -= dt;
          if (p.delay <= 0) p.state = 'boarding';
        } else if (p.state === 'boarding') {
          const dx = p.targetX - p.x;
          if (Math.abs(dx) > 3) {
            p.walking = true;
            p.dir = dx > 0 ? 1 : -1;
            p.x += p.dir * walkSpeed * dt;
          } else {
            p.walking = false;
            p.alpha -= dt * 0.9;
            if (p.alpha <= 0) {
              p.state = 'inside';
              st.tr.occ = Math.min(0.92, st.tr.occ + 0.08);
            }
          }
        } else if (p.state === 'wait_alight') {
          p.delay -= dt;
          if (p.delay <= 0) p.state = 'alighting';
        } else if (p.state === 'alighting') {
          if (p.alpha < 1) {
            p.alpha = Math.min(1, p.alpha + dt * 0.9);
          } else {
            const dx = p.targetX - p.x;
            if (Math.abs(dx) > 3) {
              p.walking = true;
              p.dir = dx > 0 ? 1 : -1;
              p.x += p.dir * walkSpeed * dt;
            } else {
              p.walking = false;
              p.state = 'on_platform';
            }
          }
        }
      } else {
        p.walking = false;
      }
    });

    const sf = st.staff;
    if (st.tr && st.tr.ph === 'stop' && st.tr.t > 2.5 && st.tr.t < st.tr.maxDwell - 4.5) {
      sf.walking = true;
      sf.waving = false;
      sf.x += sf.dir * (walkSpeed * 0.65) * dt;
      if (sf.x < W * 0.70) sf.dir = 1;
      if (sf.x > W * 0.82) sf.dir = -1;
    } else if (st.tr && st.tr.ph === 'out') {
      sf.walking = false;
      sf.dir = 1;
      sf.waving = true;
    } else {
      sf.walking = false;
    }

    const sceneInterval = +$('#sceneT').value || 180;
    if (sceneInterval > 0 && st.scT >= sceneInterval && !st.fade && !st.tr) {
      triggerSceneFade((st.sc + 1) % unl());
      st.scT = 0;
    }
  }

  st.arm += ((st.loud ? 1 : 0) - st.arm) * Math.min(1, dt * 2.5);
  if (st.page) {
    st.page.t += dt;
    if (st.page.t > 4) st.page = null;
  }
  if (st.fade) {
    st.fade.t += dt / 1.5;
    if (st.fade.t >= 0.5 && !st.fade.sw) {
      st.fade.sw = 1;
      st.sc = st.fade.n;
      st.scT = 0;
      initWaitingPassengers();
    }
    if (st.fade.t >= 1) st.fade = null;
  }

  const b = [0, 1, 2].find(x => !bd(x));
  $('#dotsTxt').textContent = b == null
    ? '👑 全圖鑑收集達成'
    : '📘 ' + SCENES[st.sc].zh + ' ' + [...Array(10).keys()].map(k => seen[b * 10 + k] ? '🟢' : '⚪').join('');
}

}

  g.setTransform(dpr, 0, 0, dpr, 0, 0);

  const { hz, railY } = sceneLayout(), ch = CH(), s = st.sc;
  const p = (st.t * 0.05) % 4, i = Math.floor(p), j = (i + 1) % 4, f = p - i, sm = f * f * (3 - 2 * f);
  let top = mix(SK[i][0], SK[j][0], sm), bot = mix(SK[i][1], SK[j][1], sm);
  const night = SK[i][2] + (SK[j][2] - SK[i][2]) * sm;
  if (s === 3) { top = '#38bdf8'; bot = '#bae6fd'; }
  if (s === 5) { top = '#04061a'; bot = '#141c48'; }

  const gr = g.createLinearGradient(0, 0, 0, hz);
  gr.addColorStop(0, top); gr.addColorStop(1, bot);
  g.fillStyle = gr; g.fillRect(0, 0, W, hz + 2);

  if (night > 0.4 || s === 5) {
    g.fillStyle = '#fff';
    for (let q = 0; q < 30; q++) {
      g.globalAlpha = s === 5 ? 0.8 : (night - 0.3) * 0.9;
      g.fillRect((q * 97) % W, (q * 53) % (hz * 0.8), 2, 2);
    }
    g.globalAlpha = 1;
  }

  g.textAlign = 'center';
  drawDistantLandmark(s, t, hz);

  g.fillStyle = GR[s]; g.fillRect(0, hz, W, H - hz);
  if (night > 0.05 && s !== 3 && s !== 5) {
    g.fillStyle = 'rgba(10, 20, 55, ' + (night * 0.26) + ')';
    g.fillRect(0, 0, W, H);
  }

  const T = st.tr, trkType = T ? M[T.i].trk : 'V';
  drawRailwayInfra(railY, ch, trkType, t);

  if (T) {
    const m = M[T.i];
    g.save();
    drawTrain(g, m, T.x, railY, ch, {
      night: s === 5 ? 0.8 : night,
      t: st.t,
      p: T.x,
      glow: T.ph === 'in',
      door: T.door,
      occ: T.occ
    });
    g.restore();
  }

  if (st.cue) {
    const a = 0.45 + 0.35 * Math.sin(t / 500);
    const q = g.createRadialGradient(16, railY - ch * 0.55, 0, 16, railY - ch * 0.55, ch * 2.0);
    q.addColorStop(0, 'rgba(255, 246, 184, ' + a + ')');
    q.addColorStop(1, 'rgba(255, 246, 184, 0)');
    g.fillStyle = q; g.fillRect(0, railY - ch * 2.2, ch * 2.4, ch * 3.2);
  }

  drawStationPlatformAndPeople(railY, ch, trkType, t);

  if (st.arm > 0.02) {
    g.fillStyle = 'rgba(60, 70, 85, ' + (0.18 * st.arm) + ')';
    g.fillRect(0, 0, W, H);
  }
  if (st.page) {
    const u = st.page.t / 4, a = Math.sin(Math.PI * u);
    g.fillStyle = 'rgba(255, 248, 210, ' + (0.35 * a) + ')';
    g.fillRect(0, 0, W, H);
    g.globalAlpha = a;
    g.font = Math.round(ch * 1.0) + 'px serif';
    g.fillText('📖', W / 2, H * 0.35);
    g.font = Math.round(ch * 0.42) + 'px serif';
    for (let k = 0; k < 10; k++) if (k <= u * 11) g.fillText('⭐', W / 2 + (k - 4.5) * ch * 0.5, H * 0.46);
    g.globalAlpha = 1;
  }
  if (st.fade) {
    const u = st.fade.t < 0.5 ? st.fade.t * 2 : (1 - st.fade.t) * 2;
    g.fillStyle = 'rgba(255, 255, 255, ' + u + ')';
    g.fillRect(0, 0, W, H);
  }
  g.restore();
}

// ===================== 新增 Debug 開發者面板 =====================
function getSystemPhaseName() {
  if (st.loud) return 'Noise';
  if (!st.tr) return st.silenceTimer > 0.5 ? 'WaitingTrain' : 'Listening';
  if (st.tr.ph === 'stop') return 'StationStop';
  return 'TrainRunning';
}

function updateDebugPanel() {
  const d = $('#dbg');
  if (!d || !d.classList.contains('on')) return;

  let acState = 'Closed';
  if (audioCtx) {
    if (audioCtx.state === 'running') acState = 'Running';
    else if (audioCtx.state === 'suspended' || audioCtx.state === 'interrupted') acState = 'Suspended';
    else acState = 'Closed';
  }

  const hasLiveMic = micStream && micStream.getAudioTracks().some(t => t.readyState === 'live' && !t.muted);
  const micStatus = (st.mic && hasLiveMic) ? 'Connected' : 'Disconnected';
  const anStatus = (analyserNode && acState === 'Running') ? 'Running' : 'Stopped';
  const waitInterval = st.first ? 4.0 : (+$('#rate').value || 15);
  const countdown = st.tr ? 0 : Math.max(0, waitInterval - st.silenceTimer);
  const sysPhase = getSystemPhaseName();

  const isSystemError = audioSystemStoppedAlert || (st.run && st.mic && (acState !== 'Running' || micStatus !== 'Connected' || anStatus !== 'Running'));
  const errBanner = isSystemError ? `<span class="err-banner">[ERROR] Audio System Stopped</span>` : '';

  d.innerHTML = `${errBanner}` +
    `AudioContext：<span class="${acState === 'Running' ? 'ok' : (acState === 'Suspended' ? 'warn' : 'bad')}">${acState}</span>\n` +
    `Microphone：<span class="${micStatus === 'Connected' ? 'ok' : 'bad'}">${micStatus}</span>\n` +
    `Analyser：<span class="${anStatus === 'Running' ? 'ok' : 'bad'}">${anStatus}</span>\n` +
    `目前音量：${Math.round(st.lvlFast)} dB\n` +
    `環境音：${Math.round(st.environmentNoise)} dB${st.calibrating ? ' (校正中...)' : ''}\n` +
    `安靜門檻：${Math.round(st.silenceThreshold)} dB\n` +
    `安靜倒數：${countdown.toFixed(1)} s\n` +
    `目前狀態：<span class="${sysPhase === 'Noise' ? 'bad' : 'ok'}">${sysPhase}</span>\n` +
    `列車總數：${st.trainCount}\n` +
    `錯誤數：${audioErrorCount}\n` +
    `最後錯誤：${lastAudioErrorMsg}`;
}

// ===================== 設定面板與事件綁定 =====================
['rate', 'dwellT', 'sceneT'].forEach(i => {
  if (cfg[i] != null && $('#' + i).querySelector(`option[value="${cfg[i]}"]`)) {
    $('#' + i).value = cfg[i];
  }
});
if (cfg.snd != null) $('#snd').checked = !!cfg.snd;
if (cfg.thresholdMargin != null) st.thresholdMargin = +cfg.thresholdMargin || 18;
if (cfg.silenceThreshold != null) {
  st.silenceThreshold = clamp(+cfg.silenceThreshold, 12, 85);
  $('#goal').value = String(st.silenceThreshold);
}

function refreshThresholdUI() {
  const gl = $('#goalLive');
  if (gl) gl.textContent = `環境 ${Math.round(st.environmentNoise)} dB / 門檻 ${Math.round(st.silenceThreshold)} dB`;
  const volGoal = $('#volGoal');
  if (volGoal) volGoal.style.left = clamp(st.silenceThreshold, 0, 100) + '%';
  document.querySelectorAll('[data-g]').forEach(b => {
    const m = +b.getAttribute('data-g');
    const on = Math.abs(st.thresholdMargin - m) <= 2;
    b.style.background = on ? '#2e7d32' : '';
    b.style.color = on ? '#fff' : '';
  });
}

$('#goal').addEventListener('input', () => {
  st.silenceThreshold = clamp(+$('#goal').value || 35, 12, 85);
  st.thresholdMargin = clamp(st.silenceThreshold - st.environmentNoise, 5, 60);
  st.acc = 0; st.loud = false;
  refreshThresholdUI();
}, { passive: true });

document.querySelectorAll('[data-g]').forEach(b => {
  b.addEventListener('click', ev => {
    ev.preventDefault();
    const margin = +b.getAttribute('data-g');
    st.thresholdMargin = margin;
    st.silenceThreshold = clamp(st.environmentNoise + margin, 12, 85);
    $('#goal').value = String(Math.round(st.silenceThreshold));
    st.acc = 0; st.loud = false;
    refreshThresholdUI();
  });
});

function saveSettings(showToast = false) {
  if ($('#sceneT').value === '0') {
    $('#sceneT').value = '180';
    triggerSceneFade((st.sc + 1) % 6);
  }
  ['rate', 'dwellT', 'sceneT'].forEach(i => { cfg[i] = $('#' + i).value; });
  cfg.snd = $('#snd').checked;
  cfg.silenceThreshold = st.silenceThreshold;
  cfg.thresholdMargin = st.thresholdMargin;
  sv('ak_cfg_v4', cfg);
  if (showToast) {
    const h = $('#saveHint');
    if (h) {
      h.textContent = '✅ 設定已儲存';
      setTimeout(() => { h.textContent = ''; }, 2500);
    }
  }
}

$('#saveCfgBtn').onclick = () => saveSettings(true);
document.querySelectorAll('#set select, #set input[type=checkbox]').forEach(el => {
  el.addEventListener('change', () => saveSettings(false));
});

$('#gear').onclick = () => {
  $('#set').hidden = !$('#set').hidden;
  refreshThresholdUI();
};

$('#dbgBtn').onclick = () => {
  $('#dbg').classList.toggle('on');
  updateDebugPanel();
};

$('#cal').onclick = async () => {
  if (!st.mic) {
    try {
      await setupMicrophoneGraph(true);
    } catch (e) {
      $('#msg').textContent = '⚠️ 請先允許瀏覽器麥克風權限';
      return;
    }
  }
  startEnvironmentCalibration();
};

const nzBtn = $('#noise');
if (nzBtn) {
  nzBtn.onpointerdown = () => { st.sim = true; };
  nzBtn.onpointerup = nzBtn.onpointerleave = nzBtn.onpointercancel = () => { st.sim = false; };
}
window.addEventListener('keydown', e => {
  if (e.code === 'Space') { st.sim = true; e.preventDefault(); }
});
window.addEventListener('keyup', e => {
  if (e.code === 'Space') { st.sim = false; }
});

$('#callBtn').onclick = () => {
  st.loud = false; st.acc = 0;
  if (!st.tr) {
    spawnTrain();
  } else if (st.tr.ph === 'stop' && st.tr.t < st.tr.maxDwell - 3.6) {
    st.tr.t = st.tr.maxDwell - 3.6;
  }
};

$('#go').onclick = async () => {
  $('#start').hidden = true;
  $('#hudTop').hidden = false;
  resizeViewport();
  initWaitingPassengers();
  st.run = true;
  st.first = true;
  st.silenceTimer = 0;

  try {
    await setupMicrophoneGraph(true);
    startEnvironmentCalibration();
  } catch (e) {
    st.mic = false;
    logAudioError('startMic', e);
    $('#msg').textContent = '⚠️ 未偵測到麥克風權限：目前已啟用模擬環境音，可按「重新校正」授權';
  }

  requestScreenWakeLock();
};

// ===================== 鐵道探索收藏館（圖鑑 Modal） =====================
function showDetail(i) {
  const m = M[i], box = $('#detailBox'), isCollected = !!seen[i];
  box.hidden = false;
  if (!isCollected) {
    box.innerHTML = `<div style="text-align:center;padding:12px"><h4>🔒 尚未收錄此列車</h4><p style="margin:4px 0;opacity:.8">保持安靜 🟢🙂，等待這列火車緩緩進站吧！</p></div>`;
    return;
  }
  const wikiUrl = `https://commons.wikimedia.org/wiki/Special:FilePath/${encodeURIComponent(m.img)}?width=500`;
  const photoSrc = customPhotos[i] || wikiUrl;
  box.innerHTML = `
    <div class="db-head">
      <div class="db-photo">
        <img id="dbImg" src="${photoSrc}" alt="${m.n}" onerror="this.style.display='none';this.nextElementSibling.style.display='block'">
        <div style="display:none;padding:8px;text-align:center;font-size:12px">📷 離線模式<br>(可點擊下方上傳真車照片)</div>
      </div>
      <div style="flex:1;min-width:200px">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <span style="font-size:18px;font-weight:900">🚄 ${m.n}</span>
          <span style="color:#f59e0b;font-size:15px">${'⭐'.repeat(m.r)}</span>
        </div>
        <div style="margin:5px 0;font-weight:700;color:#2563eb">📍 行駛區間：${m.route}</div>
        <p style="margin:5px 0;font-size:13px;line-height:1.5">${m.desc}</p>
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px;font-size:12px">
          <span style="background:#22c55e22;color:#16a34a;padding:3px 8px;border-radius:6px;font-weight:700">✅ 已收錄 (停靠 ${seen[i]} 次)</span>
          <span style="background:#8882;padding:3px 8px;border-radius:6px">${m.cars} 輛編組・${m.trk === 'V' ? '高架專用軌' : (m.trk === 'M' ? '磁浮軌道' : '在來線軌道')}</span>
          <label style="cursor:pointer;background:#3b82f622;color:#2563eb;padding:3px 8px;border-radius:6px;font-weight:700">
            📷 更換真車照片 <input type="file" id="upPhoto" accept="image/*" hidden>
          </label>
        </div>
      </div>
    </div>`;
  const up = $('#upPhoto');
  if (up) up.onchange = e => {
    const f = e.target.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = ev => { customPhotos[i] = ev.target.result; sv('ak_ph', customPhotos); showDetail(i); };
    r.readAsDataURL(f);
  };
}

function album(pg) {
  const totalSeen = Object.keys(seen).length;
  $('#dexCount').textContent = `(已收集 ${totalSeen} / ${M.length} 種)`;
  const tabs = ['第一冊：日本新幹線', '第二冊：特快與台灣鐵道', '第三冊：世界高速鐵道'].map((n, k) =>
    `<button data-p="${k}" style="margin:3px;${k === pg ? 'background:#2563eb;color:#fff' : ''}">${bd(k) ? '✅' : '📘'} ${n}</button>`
  ).join('') + `<button data-p="3" style="margin:3px;${pg === 3 ? 'background:#d97706;color:#fff' : ''}">${seen[30] ? '👑 傳說' : '❓ 傳說'}</button>`;
  $('#tabs').innerHTML = tabs;
  $('#detailBox').hidden = true;

  const ids = pg === 3 ? [30] : [...Array(10).keys()].map(k => pg * 10 + k);
  $('#grid').innerHTML = ids.map(i => {
    const m = M[i], ok = !!seen[i];
    return `<div class="dex-item" data-idx="${i}">
      <canvas width="520" height="160"></canvas>
      <div class="di-title"><span>${ok ? '🚄 ' + m.n : '🔒 ？？？'}</span><span style="color:#f59e0b">${'⭐'.repeat(m.r)}</span></div>
      <div class="di-route">${ok ? '📍 ' + m.route : '保持安靜即可解鎖收錄'}</div>
    </div>`;
  }).join('');

  document.querySelectorAll('#grid canvas').forEach((c, k) => {
    const x = c.getContext('2d'), i = ids[k], m = M[i];
    x.save();
    x.scale(2, 2);
    x.fillStyle = '#cbd5e1'; x.fillRect(0, 64, 260, 16);
    x.fillStyle = '#475569'; x.fillRect(0, 62, 260, 3);
    drawTrain(x, m, 248, 64, 28, { sil: !seen[i], t: 0, p: 0, door: 0, occ: 0.6 });
    x.restore();
  });

  document.querySelectorAll('.dex-item').forEach(el => el.onclick = () => showDetail(+el.dataset.idx));
  document.querySelectorAll('[data-p]').forEach(b => b.onclick = () => album(+b.dataset.p));
  const firstCollected = ids.find(i => seen[i]);
  if (firstCollected != null) showDetail(firstCollected);
  $('#dex').hidden = false;
}

$('#alb').onclick = () => {
  $('#badge').hidden = true;
  album([0, 1, 2].find(x => !bd(x)) ?? 0);
};
$('#dx').onclick = () => { $('#dex').hidden = true; };

// ===================== 啟動初始化與永不中斷之主動畫迴圈 =====================
resizeViewport();
initWaitingPassengers();
refreshThresholdUI();

let lastFrameTime = performance.now();
let debugTick = 0;

function mainLoop(now) {
  const dt = clamp((now - lastFrameTime) / 1000, 0.001, 0.1);
  lastFrameTime = now;

  try {
    updateGameLogic(dt);
  } catch (e) {
    logAudioError('updateGameLogic', e);
  }

  try {
    renderScene(now);
  } catch (e) {
    logAudioError('renderScene', e);
  }

  debugTick += dt;
  if (debugTick >= 0.2) {
    debugTick = 0;
    try { updateDebugPanel(); } catch (e) {}
  }

  requestAnimationFrame(mainLoop);
}

requestAnimationFrame(mainLoop);
</script>
</body>
</html>
